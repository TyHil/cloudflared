name: cloudflared

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command: tunnel --metrics 0.0.0.0:2000 --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready", "--url", "http://localhost:2000/ready"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    # Pin for Home Assistant
    networks:
      default:
        ipv4_address: 172.20.0.2

networks:
  default:
    ipam:
      config:
        - subnet: 172.20.0.0/16